name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versão a publicar (ex.: v0.1.0); a tag é criada no commit escolhido'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Gerar instalador e versão portátil
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Física Teórica ${{ inputs.tag || github.ref_name }}
          files: release/*.exe
          body: |
            Aplicativo de desktop para Windows (64 bits).

            - **FisicaTeorica-Setup-*.exe**: instalador (cria atalho na área de trabalho e no menu Iniciar).
            - **FisicaTeorica-Portatil-*.exe**: versão portátil, roda sem instalar.

            O executável não é assinado digitalmente; o Windows SmartScreen pode exibir um aviso. Clique em "Mais informações" → "Executar assim mesmo".
